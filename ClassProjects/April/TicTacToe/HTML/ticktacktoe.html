<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="../CSS/styles.css"/>
</head>
<body>

  <div class="container text-center mt-5">
    <h1 class="mb-2">Tic-Tac-Toe</h1>

    <div class="mb-3">
      <div class="btn-group" role="group">
        <input type="radio" class="btn-check" name="mode" id="pvp" value="pvp" checked/>
        <label class="btn btn-outline-primary" for="pvp">Two Players</label>

        <input type="radio" class="btn-check" name="mode" id="pvc" value="pvc"/>
        <label class="btn btn-outline-secondary" for="pvc">vs Computer</label>
      </div>
    </div>

    <div id="status" class="alert alert-info status-box">Player X's turn</div>

    <div id="notification" class="alert alert-warning d-none notification-box">
      That cell is already taken! Choose another one.
    </div>

    <div id="boardWrapper" class="board-wrapper mx-auto mb-4">
      <div id="board" class="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>
    </div>

    <button id="restartBtn" class="btn btn-success btn-lg">Play Again</button>
  </div>

  <script src="../JS/script.js"></script>
</body>
</html>
