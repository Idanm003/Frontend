<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Purchase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/buyTest.css">
</head>

<body class="buyPage">
    <div class="buyContainer">
        <div class="card buyCard shadow-lg">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <h3 class="mt-2 mb-0">Complete your purchase</h3>
                    <p class="text-muted">Please fill in your payment details</p>
                </div>

                <div class="mb-3">
                    <label class="form-label">Name of the store:</label>
                    <input type="text" class="form-control" id="storeName">
                </div>

                <div class="mb-3">
                    <label class="form-label">Total Price:</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="priceFinal">
                        <span class="input-group-text">₪</span>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Credit Card number:</label>
                    <input type="text" class="form-control" id="creditCard" placeholder="xxxx xxxx xxxx xxxx"
                        maxlength="19">
                </div>

                <div class="mb-4">
                    <label class="form-label">Date of expiration:</label>
                    <input type="text" class="form-control" id="expirationDate" placeholder="xx/xx/xxxx">
                </div>
                <div class="mb-3">
                    <label class="form-label">CVV:</label>
                    <input type="text" class="form-control" id="cvv" placeholder="xxx" maxlength="3">
                </div>
                <div class="mb-3">
                    <label class="form-label">Cardholder's name:</label>
                    <input type="text" class="form-control" id="cardholderName"
                        placeholder="Name as it appears on the card">
                </div>

                <div class="d-grid">
                    <button class="btn btn-success btn-lg" onclick="sendOrder()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../JS/buyTest.js"></script>
</body>

</html>
