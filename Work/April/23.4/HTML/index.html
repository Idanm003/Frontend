<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link rel="stylesheet" href="../CSS/style.css" />
  </head>
  <body>
    <h2 class="title">Hello, World!</h2>
    <form class="custom-form">
      <input class="text-input" type="text" />
      <button type="submit" class="click-btn">Click Me</button>
      <button type="button" class="remove-content-btn">Clear Content</button>
    </form>

    <div class="content">
      <h4>The Input Value Will Be Displayed Here After The Click</h4>
      <div class="display-content"></div>
      <span class="span-content"></span>
    </div>

    <span class="extra-span">extra-span</span>
    <script src="../JS/script.js"></script>
  </body>
</html>
