<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS/calculatorstyle.css">
</head>

<body>

    <h1>Calculator</h1>
    <div id="calculator">
        <input type="number" id="firstNumber" placeholder="Enter Your First Number" />
        <input type="text" id="operator" placeholder="Enter Your Operator" />
        <input type="number" id="secondNumber" placeholder="Enter Your Second Number" />
        <button id="calculate">Calculate</button>
        <p id="output">Your Output Here.</p>
    </div>
    <hr>

    <h1>Feed The Cat</h1>
    <div id="cat-status">
        <p>Tiredness: <span id="cat-tiredness"></span></p>
        <p>Hunger: <span id="cat-hunger"></span></p>
        <p>Loneliness: <span id="cat-loneliness"></span></p>
        <p>Happiness: <span id="cat-happiness"></span></p>
    </div>
    <button id="btn-feed">Feed</button>
    <button id="btn-sleep">Sleep</button>
    <button id="btn-pet">Pet</button>
    <button id="btn-play">Play</button>

</body>
<script src="../JS/calculatorscript.js"></script>

</html>
