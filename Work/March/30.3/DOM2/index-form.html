<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style-form.css">
</head>

<body>
    <form id="studentRegistrationID">
        <div class="studentRegistrationID-group">
            <label for="studentFullNameID">Full Name</label>
            <input type="text" name="studentFormFullName" id="studentFullNameID" placeholder="Full Name" />
        </div>
        <div class="studentRegistrationID-group">
            <label for="studentAgeID">Age</label>
            <input type="number" name="studentFormAge" id="studentAgeID" placeholder="Age" />
        </div>
        <div class="studentRegistrationID-group">
            <label for="studentEmailID">Email</label>
            <input type="email" name="studentFormEmail" id="studentEmailID" placeholder="Email" />
        </div>
        <button type="submit" id="submitButtonID">Register Student</button>
    </form>
    <script src="./script-form.js"></script>
</body>

</html>
